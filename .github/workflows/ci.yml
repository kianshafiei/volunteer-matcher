name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python scripts/get_model.py
      - run: python -m pytest -q tests
      - run: python evaluate.py
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vmatch .
      - run: |
          docker run -d -p 8000:8000 --name vm vmatch
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/match -H 'content-type: application/json' -d '{"text":"help at a food bank","k":3}'
